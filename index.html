<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voz do Bairro - Itajaí</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Topbar -->
    <header class="topbar">
        <div class="logo">
            <h1>Voz do Bairro</h1>
            <span>Itajaí (SC)</span>
        </div>
        <button id="btn-novo-alerta" class="btn-primary">+ Registrar Problema</button>
    </header>

    <!-- Filtros por Categoria -->
    <nav class="filtros">
        <button class="btn-filtro active" data-categoria="todos">Todos</button>
        <button class="btn-filtro" data-categoria="iluminacao">💡 Iluminação</button>
        <button class="btn-filtro" data-categoria="pavimentacao">🛣️ Pavimentação</button>
        <button class="btn-filtro" data-categoria="saneamento">🗑️ Saneamento</button>
    </nav>

    <!-- Mapa Ocupando a Tela Inteira -->
    <main id="mapa-container"></main>

    <!-- PAINEL FLUTUANTE DE CONFIRMAÇÃO DO PINO (Oculto por padrão) -->
    <div id="painel-confirmacao" class="oculta" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2000; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; border: 2px solid #006039; width: 90%; max-width: 400px;">
        <p style="margin-bottom: 15px; font-weight: bold; color: #333; font-size: 1.05rem;">📍 Arraste o pino para o local exato!</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="btn-cancelar-local" style="background: #dc3545; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 50%;">Cancelar</button>
            <button id="btn-confirmar-local" style="background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 50%;">✅ Confirmar</button>
        </div>
    </div>

    <!-- Modal para Registro de Texto -->
    <div id="modal-registro" class="modal oculta">
        <div class="modal-content">
            <h2>Novo Registro</h2>
            <p class="instrucao">Preencha os dados básicos do problema.</p>
            
            <form id="form-ocorrencia">
                <label>Categoria:</label>
                <select id="categoria" required>
                    <option value="">Selecione...</option>
                    <option value="iluminacao">Iluminação (Poste apagado)</option>
                    <option value="pavimentacao">Pavimentação (Buraco na via)</option>
                    <option value="saneamento">Saneamento (Lixo/Bueiro)</option>
                </select>

                <label>Nome da Rua/Avenida:</label>
                <input type="text" id="endereco" placeholder="Ex: Rua Hercílio Luz" required>

                <label>Número:</label>
                <input type="text" id="numero" placeholder="Ex: 350" required>

                <label>Descrição breve:</label>
                <textarea id="descricao" rows="3" placeholder="Ex: Buraco grande..." required></textarea>
                
                <div class="acoes-form">
                    <button type="button" id="btn-cancelar" class="btn-secundary">Cancelar</button>
                    <!-- O botão agora diz Avançar em vez de Salvar -->
                    <button type="submit" id="btn-salvar" class="btn-primary">Avançar para o Mapa 🗺️</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
