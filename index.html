<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voz do Bairro - Itajaí</title>
    
    <!-- Importando o CSS do Leaflet (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Nosso estilo customizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Cabeçalho do App -->
    <header class="topbar">
        <div class="logo">
            <h1>Voz do Bairro</h1>
            <span>Itajaí (SC)</span>
        </div>
        <button id="btn-novo-alerta" class="btn-primary">+ Registrar Problema</button>
    </header>

    <!-- Filtros por Categoria -->
    <nav class="filtros">
        <button class="btn-filtro active" data-categoria="todos">Todos</button>
        <button class="btn-filtro" data-categoria="iluminacao">💡 Iluminação</button>
        <button class="btn-filtro" data-categoria="pavimentacao">🛣️ Pavimentação</button>
        <button class="btn-filtro" data-categoria="saneamento">🗑️ Saneamento</button>
    </nav>

    <!-- Container onde o mapa será renderizado -->
    <main id="mapa-container"></main>

    <!-- Modal para registrar nova ocorrência (escondido por padrão) -->
    <div id="modal-registro" class="modal oculta">
        <div class="modal-content">
            <h2>Novo Registro</h2>
            <p class="instrucao">Clique no mapa para marcar o local exato do problema.</p>
            
            <form id="form-ocorrencia">
                <label>Categoria:</label>
                <select id="categoria" required>
                    <option value="">Selecione...</option>
                    <option value="iluminacao">Iluminação (Poste apagado)</option>
                    <option value="pavimentacao">Pavimentação (Buraco na via)</option>
                    <option value="saneamento">Saneamento (Lixo/Bueiro)</option>
                </select>

                <label>Nome da Rua/Avenida:</label>
                <input type="text" id="endereco" placeholder="Ex: Rua Hercílio Luz" required>

                <label>Número:</label>
                <input type="text" id="numero" placeholder="Ex: 350" required>

                <label>Descrição breve:</label>
                <textarea id="descricao" rows="3" placeholder="Ex: Buraco grande próximo à faixa de pedestres..." required></textarea>
                
                <div class="acoes-form">
                    <button type="button" id="btn-cancelar" class="btn-secundary">Cancelar</button>
                    <button type="submit" id="btn-salvar" class="btn-primary">Publicar Alerta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Importando o Leaflet (Mapa) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Importando o Firebase SDK (Versão Modular via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração do seu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDscqk9uFIFZ-9Z27Ci0pxoifLD8Gj5h3c",
            authDomain: "voz-do-bairro-58727.firebaseapp.com",
            projectId: "voz-do-bairro-58727",
            storageBucket: "voz-do-bairro-58727.firebasestorage.app",
            messagingSenderId: "62321635310",
            appId: "1:62321635310:web:e4a6a91a0da3215d3a28ff"
        };

        // Inicializa o Firebase e o Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Deixamos o banco global para o script.js usar
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.increment = increment;
    </script>

    <!-- Nosso script principal com a lógica do mapa -->
    <script src="script.js"></script>
</body>
</html>
