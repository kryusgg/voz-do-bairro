<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voz do Bairro - Itajaí</title>
    
    <!-- Importando o CSS do Leaflet (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Nosso estilo customizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Cabeçalho do App -->
    <header class="topbar">
        <div class="logo">
            <h1>Voz do Bairro</h1>
            <span>Itajaí (SC)</span>
        </div>
        <button id="btn-novo-alerta" class="btn-primary">+ Registrar Problema</button>
    </header>

    <!-- Filtros por Categoria -->
    <nav class="filtros">
        <button class="btn-filtro active" data-categoria="todos">Todos</button>
        <button class="btn-filtro" data-categoria="iluminacao">💡 Iluminação</button>
        <button class="btn-filtro" data-categoria="pavimentacao">🛣️ Pavimentação</button>
        <button class="btn-filtro" data-categoria="saneamento">🗑️ Saneamento</button>
    </nav>

    <!-- Container onde o mapa será renderizado -->
    <main id="mapa-container"></main>

    <!-- Modal para registrar nova ocorrência (escondido por padrão) -->
    <div id="modal-registro" class="modal oculta">
        <div class="modal-content">
            <h2>Novo Registro</h2>
            <p class="instrucao">Clique no mapa para marcar o local exato do problema.</p>
            
            <form id="form-ocorrencia">
                <label>Categoria:</label>
                <select id="categoria" required>
                    <option value="">Selecione...</option>
                    <option value="iluminacao">Iluminação (Poste apagado)</option>
                    <option value="pavimentacao">Pavimentação (Buraco na via)</option>
                    <option value="saneamento">Saneamento (Lixo/Bueiro)</option>
                </select>

                <label>Nome da Rua/Avenida:</label>
                <input type="text" id="endereco" placeholder="Ex: Rua Hercílio Luz" required>

                <label>Número:</label>
                <input type="text" id="numero" placeholder="Ex: 350" required>

                <label>Descrição breve:</label>
                <textarea id="descricao" rows="3" placeholder="Ex: Buraco grande próximo à faixa de pedestres..." required></textarea>
                
                <div class="acoes-form">
                    <button type="button" id="btn-cancelar" class="btn-secundary">Cancelar</button>
                    <button type="submit" id="btn-salvar" class="btn-primary">Publicar Alerta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Importando o JS do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Nosso script com a lógica -->
    <script src="script.js"></script>
</body>
</html>
